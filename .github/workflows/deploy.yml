name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: |
          npm run build
          test -f dist/index.html || (echo "index.html not found in dist!" && exit 1)
          test -f dist/sitemap.xml || (echo "sitemap.xml not found in dist!" && exit 1)
          test -f dist/.htaccess || (echo ".htaccess not found in dist!" && exit 1)

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOSTNAME }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /domains/aarohitavigyan.com/public_html/
          exclude: |
            **/.git*
            **/.git*/**

      # Tell Bing/Yandex (IndexNow) about every page so new content is indexed fast.
      # ChatGPT search and Copilot rely on Bing's index. Non-blocking: a failed ping never fails the deploy.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: |
          KEY=76d235aea196ef2053405e9053105c4d
          URLS=$(grep -o '<loc>[^<]*</loc>' dist/sitemap.xml | sed 's/<[^>]*>//g' | jq -R . | jq -s -c .)
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"aarohitavigyan.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://aarohitavigyan.com/$KEY.txt\",\"urlList\":$URLS}"
